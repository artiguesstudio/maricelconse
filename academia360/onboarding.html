<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="/academia360/imagenes/isotipo.png?v=1">
  <link rel="apple-touch-icon" href="/academia360/imagenes/isotipo.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Onboarding — Academia de Mujeres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabaseClient.js"></script>
  <script src="./auth.js"></script>

  <<script defer src="./onboarding.js?v=20260302-2"></script>
</head>

<body class="register-page">
  <div id="globalLoader" class="loader" aria-hidden="true">
    <div class="loader__spinner" role="status" aria-label="Cargando"></div>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <div class="brand-left">
        <a class="brand" href="./app.html" style="text-decoration:none">MARICEL CONSE</a>
        <div class="brand-sub">Onboarding</div>
      </div>
      <nav class="header-actions" style="gap:10px">
        <a class="btn" href="./app.html">Volver al panel</a>
      </nav>
    </div>
  </header>

  <section class="hero-banner">
    <div class="banner-full">
      <div class="container banner-inner">
        <div class="banner-card">
          <a class="banner-logo" href="./app.html" aria-label="Volver al panel">
            <img src="./imagenes/Isotipo.png" alt="Maricel Conse" onerror="this.style.display='none'">
          </a>
          <div class="banner-text">
            <div class="banner-title">TU FICHA (2 MIN)</div>
            <div class="banner-subtitle">CON ESTO PERSONALIZAMOS TU RUTINA</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="container page">
    <div class="grid" style="margin-top:18px">
      <div class="card">
        <h3>Completar ficha</h3>
        <div class="small" id="obSubcopy">
          Tu acceso ya está activo ✅ Completá esto y tu rutina personalizada llega dentro de <b>48 hs</b>.
        </div>
        <div class="hr"></div>

        <form id="obForm" class="form" autocomplete="on">

          <label class="small">Edad</label>
          <input class="input" id="obAge" type="number" min="10" max="90" placeholder="Ej: 32" required />

          <label class="small">Peso (kg) (opcional)</label>
          <input class="input" id="obWeight" type="number" min="20" max="300" step="0.1" placeholder="Ej: 72.5" />

          <label class="small">Altura (cm) (opcional)</label>
          <input class="input" id="obHeight" type="number" min="100" max="250" step="1" placeholder="Ej: 172" />

          <div class="hr"></div>

          <label class="small">Objetivo</label>
          <select class="input" id="obObjective" required>
            <option value="fat_loss">Perder peso</option>
            <option value="muscle_gain">Ganar masa muscular</option>
          </select>

          <label class="small">¿Dónde vas a entrenar?</label>
          <select class="input" id="obTrack" required>
            <option value="home">Casa</option>
            <option value="gym">Gimnasio</option>
          </select>

          <label class="small">Nivel de entrenamiento</label>
          <select class="input" id="obLevel" required>
            <option value="beginner">Principiante</option>
            <option value="intermediate">Intermedio</option>
            <option value="advanced">Avanzado</option>
          </select>

          <label class="small">Lesiones / condiciones (opcional)</label>
          <textarea class="input" id="obNotes" rows="4" placeholder="Ej: molestias rodilla / cervical / etc."></textarea>

          <button class="btn primary" id="obSaveBtn" type="submit">Guardar y continuar</button>
          <div id="obMsg" class="small" style="margin-top:10px"></div>

          <!-- Si no está activo, mostramos pagar -->
          <div id="obPayBox" style="display:none;margin-top:14px">
            <div class="notice small" id="obPayHint">Tu plan todavía no figura activo. Si ya pagaste, esperá unos minutos. Si no, completá el pago.</div>
            <div style="margin-top:10px">
              <button class="btn primary" id="obPayBtn" type="button">Ir a pagar</button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script>
    // Header transparente -> sólido
    const header = document.getElementById("siteHeader");
    const onScroll = () => {
      if (!header) return;
      if (window.scrollY > 16) header.classList.add("is-scrolled");
      else header.classList.remove("is-scrolled");
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
  </script>

  <script src="./loader.js"></script>
</body>
</html>
