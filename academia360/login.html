<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingresar — Academia de Mujeres</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabaseClient.js"></script>
  <script src="./auth.js"></script>
</head>

<body>
<!-- Global Loader -->
<div id="globalLoader" class="loader" aria-hidden="true">
  <div class="loader__spinner" role="status" aria-label="Cargando"></div>
</div>
  <!-- HEADER fijo + transparente -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <div class="brand-left">
      </div>
    </div>
  </header>

  <!-- BANNER FULL WIDTH -->
  <section class="hero-banner">
    <div class="banner-full">
      <div class="container banner-inner">
        <div class="banner-card">
          <a class="banner-logo" href="./index.html" aria-label="Volver al inicio">
  <img src="./imagenes/Isotipo.png" alt="Maricel Conse" onerror="this.style.display='none'">
</a>

          <div class="banner-text">
            <div class="banner-title">BIENVENIDA !</div>
            <div class="banner-subtitle">ACADEMIA DE MUJERES</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTENIDO -->
  <main class="container page">
    <div class="grid" style="margin-top:18px">
      <!-- Form -->
      <div class="card">
        <h3>Ingresar</h3>
        <div id="msg" class="small" style="margin-top:6px"></div>
        <div class="hr"></div>

        <form id="loginForm" class="form">
          <input class="input" id="email" type="email" placeholder="Email" autocomplete="email" required />
          <input class="input" id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
          <button class="btn primary" type="submit">Entrar</button>

          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <a class="small" href="./register.html">No tengo cuenta</a>
            <a class="small" href="./reset.html" style="text-decoration:none">Olvidé mi contraseña</a>
          </div>
        </form>
      </div>

      <!-- Info -->
      <div class="card">
        <h3>Acceso</h3>
        <p class="small">Si tu suscripción está activa, vas a ver los meses liberados + tu progreso.</p>
        <div class="notice small">Tip: usá el mismo email con el que vas a pagar.</div>
      </div>
    </div>
  </main>

  <!-- FOOTER con contacto -->
  <footer id="contacto" class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="footer-title">Contacto</a>
      </div>

   
      <div class="socials" aria-label="Redes sociales">
  <a class="social" href="https://www.facebook.com/profile.php?id=61579704266004&locale=es_LA#" target="_blank" rel="noopener" aria-label="Facebook">
    <img src="./imagenes/facebook.png" alt="Facebook" loading="lazy">
  </a>

  <a class="social" href="https://www.instagram.com/maricelconse/" target="_blank" rel="noopener" aria-label="Instagram">
    <img src="./imagenes/instagram.png" alt="Instagram" loading="lazy">
  </a>

  <a class="social" href="https://wa.me/5492964406552" target="_blank" rel="noopener" aria-label="WhatsApp">
    <img src="./imagenes/whatsapp.png" alt="WhatsApp" loading="lazy">
  </a>

  <a class="social" href="https://www.tiktok.com/@maricelconse" target="_blank" rel="noopener" aria-label="TikTok">
    <img src="./imagenes/tiktok.png" alt="TikTok" loading="lazy">
  </a>

  <a class="social" href="https://www.youtube.com/@maricelconse" target="_blank" rel="noopener" aria-label="YouTube">
    <img src="./imagenes/youtube.png" alt="YouTube" loading="lazy">
  </a>
</div>

      <div class="small2" style="margin-top:14px;opacity:.8">
        © <span id="year"></span> Maricel Conse · Academia de Mujeres
      </div>
    </div>
  </footer>

  <script>
    // Año
    document.getElementById("year").textContent = new Date().getFullYear();

    // Header transparente -> sólido al scrollear
    const header = document.getElementById("siteHeader");
    const onScroll = () => {
      if (window.scrollY > 16) header.classList.add("is-scrolled");
      else header.classList.remove("is-scrolled");
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });

    // Sesión: si está logueada, ajustar header
    (async () => {
      try {
        const { data } = await sb.auth.getSession();
        const hasSession = !!data?.session;

        const goAppBtn = document.getElementById("goAppBtn");
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");

        if (hasSession) {
          goAppBtn.style.display = "inline-flex";
          loginBtn.style.display = "none";
          registerBtn.style.display = "none";
        }
      } catch (e) {}
    })();

    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const msg = document.getElementById("msg");
      msg.className = "small";
      msg.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          msg.className = "error";
          msg.textContent = error.message;
          return;
        }

        window.location.href = "./app.html";
      } catch (err) {
        msg.className = "error";
        msg.textContent = "Ocurrió un error. Intentá nuevamente.";
      }
    });
  </script>
<script src="./loader.js"></script>
</body>
</html>
