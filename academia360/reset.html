<!doctype html>
<html lang="es">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuperar contraseña — Academia de Mujeres</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabaseClient.js"></script>
  <script defer src="./reset.js"></script>
</head>

<body class="auth-page">
  <!-- Global Loader -->
  <div id="globalLoader" class="loader" aria-hidden="true">
    <div class="loader__spinner" role="status" aria-label="Cargando"></div>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="./index.html" style="text-decoration:none">MARICEL CONSE</a>
      <nav class="header-actions">
        <a class="btn" href="./login.html">Volver</a>
      </nav>
    </div>
  </header>

  <main class="container page" style="max-width:520px">
    <div class="card">
      <h2 style="margin:0">Recuperar contraseña</h2>
      <div class="small" style="margin-top:6px;opacity:.85">
        Te vamos a enviar un email con un link para crear una nueva contraseña.
      </div>

      <div class="form" style="margin-top:14px">
        <label class="small" for="resetEmail">Email</label>
        <input class="input" id="resetEmail" type="email" placeholder="tu@email.com" />

        <button class="btn primary" id="resetBtn" type="button" style="margin-top:10px">
          Enviar link de recuperación
        </button>

        <div id="resetMsg" class="small" style="margin-top:10px"></div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer id="contacto" class="site-footer">
    <div class="container footer-inner">
      <div class="footer-title">Contacto</div>

      <div class="socials" aria-label="Redes sociales">
        <a class="social" href="https://www.facebook.com/profile.php?id=61579704266004&locale=es_LA#"
           target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <img src="./imagenes/facebook.png" alt="Facebook" loading="lazy">
        </a>

        <a class="social" href="https://www.instagram.com/maricelconse/"
           target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <img src="./imagenes/instagram.png" alt="Instagram" loading="lazy">
        </a>

        <a class="social" href="https://wa.me/5492964406552"
           target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <img src="./imagenes/whatsapp.png" alt="WhatsApp" loading="lazy">
        </a>

        <a class="social" href="https://www.tiktok.com/@maricelconse"
           target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <img src="./imagenes/tiktok.png" alt="TikTok" loading="lazy">
        </a>

        <a class="social" href="https://www.youtube.com/@maricelconse"
           target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <img src="./imagenes/youtube.png" alt="YouTube" loading="lazy">
        </a>
      </div>

      <div class="small2" style="margin-top:14px;opacity:.8">
        © <span id="year"></span> Maricel Conse · Academia de Mujeres
      </div>

      <div style="margin-top:10px;display:flex;justify-content:center;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;text-align:center;opacity:.55;">
          <a class="small" href="#" data-legal-open="a360-terms" style="text-decoration:none;">Términos y condiciones</a>
          <span class="small" style="opacity:.35" aria-hidden="true">·</span>
          <a class="small" href="#" data-legal-open="a360-privacy" style="text-decoration:none;">Privacidad</a>
          <span class="small" style="opacity:.35" aria-hidden="true">·</span>
          <a class="small" href="#" data-legal-open="a360-arrepentimiento" style="text-decoration:none;">Botón de arrepentimiento</a>
          <span class="small" style="opacity:.35" aria-hidden="true">·</span>
          <a class="small" href="#" data-legal-open="a360-baja" style="text-decoration:none;">Baja de servicio</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- (Legal popups: pegá exactamente los mismos 4 <div class="legal-modal"...> que usás en login/index/register)
       Para no duplicar contenido, mantenelos idénticos en todos los HTML. -->

  <script>
    // Año
    const y = document.getElementById("year");
    if (y) y.textContent = new Date().getFullYear();

    // Header sólido al scrollear (touch-friendly)
    const header = document.getElementById("siteHeader");
    const onScroll = () => {
      if (!header) return;
      if (window.scrollY > 16) header.classList.add("is-scrolled");
      else header.classList.remove("is-scrolled");
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
  </script>

  <script src="./loader.js"></script>
</body>
</html>
